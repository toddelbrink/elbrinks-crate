<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Crate Admin</title>
<link rel="icon" href="/vinyl/favicon.ico">
<style>
:root{
  --bg:#0a0a0a;--surface:#141414;--surface2:#1f1f1f;--text:#f0f0f0;--muted:#9a9a9a;
  --accent:#d63b3b;--border:#2a2a2a;
  --green:#3fb950;--red:#f85149;--blue:#58a6ff;--amber:#d4a72c;--purple:#a371f7;--rose:#f778ba;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

.bar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;z-index:10}
.bar-title{font-size:16px;font-weight:700}
.bar-meta{font-size:12px;color:var(--muted)}

.tabs{display:flex;gap:4px;padding:10px 18px 0;border-bottom:1px solid var(--border);background:var(--bg)}
.tab{padding:10px 14px;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab[disabled]{color:#555;cursor:not-allowed;position:relative}
.tab[disabled]::after{content:'v1.1';position:absolute;top:2px;right:0;font-size:9px;color:#555;font-weight:500;letter-spacing:.04em;text-transform:uppercase}

.wrap{max-width:900px;margin:0 auto;padding:18px}

.empty,.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;color:var(--muted);text-align:center;padding:24px}
.empty h1{color:var(--text);font-size:22px;font-weight:700;margin:0 0 8px}
.empty p{margin:0 0 16px;max-width:360px}
.btn{padding:10px 18px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text)}

.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.row:hover{border-color:var(--accent)}
.row-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row-email{font-size:13px;font-weight:600;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 200px}
.row-time{font-size:11px;color:var(--muted);white-space:nowrap}
.row-body{margin-top:8px;font-size:13px;color:var(--text);line-height:1.5;white-space:pre-wrap;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row-body.empty-body{color:var(--muted);font-style:italic;-webkit-line-clamp:none}
.row.expanded .row-body{display:block;-webkit-line-clamp:none;overflow:visible;white-space:pre-wrap}
.row-foot{margin-top:8px;font-size:11px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.row-foot.hidden{display:none}
.row.expanded .row-foot{display:flex}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
.pill-cat-bug{background:#3a1f1f;color:#ff7b72}
.pill-cat-idea{background:#1f2a3a;color:#79b8ff}
.pill-cat-confusion{background:#3a2e1f;color:#d4a72c}
.pill-cat-praise{background:#1f3a26;color:#3fb950}
.pill-cat-other{background:#2a2a2a;color:#bbb}
.pill-sent-up{background:#1f3a26;color:#3fb950}
.pill-sent-down{background:#3a1f1f;color:#f85149}

.stats{font-size:12px;color:var(--muted);margin-bottom:14px}

.refresh{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;padding:4px 8px}
.refresh:hover{color:var(--text)}
</style>
</head>
<body>

<div class="bar">
  <div>
    <div class="bar-title">Crate Admin</div>
    <div class="bar-meta" id="barMeta">Loading…</div>
  </div>
  <a href="/vinyl/" class="bar-meta">← Back to Crate</a>
</div>

<div class="tabs">
  <button class="tab active">Feedback</button>
  <button class="tab" disabled title="Events tab ships in v1.1">Events</button>
  <button class="tab" disabled title="Users tab ships in v1.1">Users</button>
</div>

<div class="wrap" id="wrap">
  <div class="center" id="loading">Loading…</div>
</div>

<script>window.crateReady = new Promise(r => window._crateReadyResolve = r);</script>
<script type="module" src="/lib/supabase.js"></script>
<script>
const $ = id => document.getElementById(id);

function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function relTime(iso){
  if(!iso) return '';
  const then = new Date(iso).getTime();
  const now = Date.now();
  const s = Math.floor((now-then)/1000);
  if(s<60) return s+'s ago';
  const m = Math.floor(s/60);
  if(m<60) return m+'m ago';
  const h = Math.floor(m/60);
  if(h<24) return h+'h ago';
  const d = Math.floor(h/24);
  if(d<7) return d+'d ago';
  return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}

function fullTime(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});
}

function renderNotAuthed(){
  $('wrap').innerHTML = `
    <div class="empty">
      <h1>Sign in required</h1>
      <p>This area is for the Crate admin. Sign in on the main app, then come back.</p>
      <a class="btn" href="/vinyl/">Go to Crate</a>
    </div>`;
  $('barMeta').textContent = '';
}

function renderNotFound(){
  // Same look as a 404. Don't reveal that the route exists for non-admins.
  $('wrap').innerHTML = `
    <div class="empty">
      <h1>404</h1>
      <p>This page doesn't exist.</p>
      <a class="btn" href="/vinyl/">Back to Crate</a>
    </div>`;
  $('barMeta').textContent = '';
  document.title = 'Not found';
}

function renderError(msg){
  $('wrap').innerHTML = `
    <div class="empty">
      <h1>Couldn't load feedback</h1>
      <p>${escapeHtml(msg)}</p>
      <button class="btn" onclick="location.reload()">Retry</button>
    </div>`;
}

function renderEmpty(){
  $('wrap').innerHTML = `
    <div class="empty">
      <h1>No feedback yet</h1>
      <p>Once users start submitting, rows will land here newest first.</p>
    </div>`;
}

function renderList(rows, emailMap){
  const summary = `<div class="stats">${rows.length} ${rows.length===1?'row':'rows'} · newest first</div>`;
  const items = rows.map((r,i) => {
    const email = emailMap[r.user_id] || r.user_id.slice(0,8)+'…';
    const sentPill = r.sentiment==='up'
      ? '<span class="pill pill-sent-up">▲ Up</span>'
      : r.sentiment==='down'
        ? '<span class="pill pill-sent-down">▼ Down</span>'
        : '';
    const catClass = 'pill-cat-' + (r.category || 'other');
    const catPill = r.category
      ? `<span class="pill ${catClass}">${escapeHtml(r.category)}</span>`
      : '';
    const body = r.body ? escapeHtml(r.body) : '<em>No body</em>';
    const bodyClass = r.body ? 'row-body' : 'row-body empty-body';
    return `
      <div class="row" data-idx="${i}">
        <div class="row-head">
          <span class="row-email">${escapeHtml(email)}</span>
          ${sentPill}
          ${catPill}
          <span class="row-time">${relTime(r.created_at)}</span>
        </div>
        <div class="${bodyClass}">${body}</div>
        <div class="row-foot hidden">
          <span>${fullTime(r.created_at)}</span>
          ${r.app_version ? `<span>${escapeHtml(r.app_version)}</span>` : ''}
          <span title="${escapeHtml(r.user_id)}">${escapeHtml(r.user_id.slice(0,8))}…</span>
        </div>
      </div>`;
  }).join('');
  $('wrap').innerHTML = summary + `<div class="list">${items}</div>`;
  document.querySelectorAll('.row').forEach(row => {
    row.addEventListener('click', () => row.classList.toggle('expanded'));
  });
}

async function load(crate, session){
  $('barMeta').textContent = session.user.email;
  const res = await crate.loadAllFeedback({ limit: 200 });
  if(!res.success){
    renderError(res.error || 'Unknown error');
    return;
  }
  const rows = res.data || [];
  if(!rows.length){ renderEmpty(); return; }
  const userIds = [...new Set(rows.map(r => r.user_id))];
  const emailRes = await crate.loadUserEmails(userIds);
  const emailMap = (emailRes.success ? emailRes.data : {}) || {};
  renderList(rows, emailMap);
}

crateReady.then(async crate => {
  const session = await crate.getSession();
  if(!session){ renderNotAuthed(); return; }
  if(!crate.isAdmin(session)){ renderNotFound(); return; }
  load(crate, session);
});
</script>
</body>
</html>
