<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Elbrink's Crate</title>
<meta name="description" content="Todd Elbrink's vinyl collection. Browse the crate, explore stats, and see what's spinning.">
<meta property="og:title" content="Elbrink's Crate">
<meta property="og:description" content="Todd Elbrink's vinyl collection. Browse the crate, explore stats, and see what's spinning.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://elbrink.com/crate/elbrink">
<meta property="og:image" content="https://elbrink.com/vinyl/icon-v3-512.png">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/x-icon" href="/vinyl/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/vinyl/icon-v3-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/vinyl/apple-touch-icon-v3.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--surface:#161616;--surface2:#1f1f1f;--border:#2a2a2a;
  --text:#f0f0f0;--muted:#888;--accent:#e8372c;--radius:12px;
  --nav-h:64px;--font:'Helvetica Neue',Helvetica,Arial,sans-serif
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overscroll-behavior:none;padding-bottom:var(--nav-h)}
a{color:inherit;text-decoration:none}
header{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:sticky;top:0;background:var(--bg);z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo span{font-size:17px;font-weight:700;letter-spacing:-0.5px;color:#f0f0f0}
.logo span em{color:#e8372c;font-style:normal}
/* Search overlay bar */
.search-overlay{position:fixed;top:0;left:0;right:0;background:var(--bg);z-index:150;padding:10px 16px;display:none;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.search-overlay.open{display:flex}
.search-overlay input{flex:1}
.search-cancel{background:none;border:none;color:var(--accent);font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;z-index:220;padding:0 12px;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{background:none;border:none;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 16px;font-family:var(--font);font-size:10px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;transition:color .15s;min-width:64px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{width:22px;height:22px}
/* Main */
#mainContent{padding:16px}
.controls-row{display:flex;gap:8px;margin-bottom:12px}
.ctrl-btn{flex:1;background:var(--surface2);border:none;border-radius:8px;color:var(--text);cursor:pointer;font-family:var(--font);font-size:12px;font-weight:600;padding:8px 10px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ctrl-btn.active-filter{color:var(--accent)}
input[type=text]{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:14px;padding:10px 12px;width:100%;outline:none}
input:focus{border-color:var(--accent)}
.search-bar{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:14px;padding:10px 14px;width:100%;outline:none}
.search-bar:focus{border-color:var(--accent)}
.collection-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.count-badge{color:var(--muted);font-size:14px}
/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.record-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.record-card:hover{transform:translateY(-2px);border-color:#444}
.art-wrap{aspect-ratio:1;background:var(--surface2);overflow:hidden}
.art-wrap img{width:100%;height:100%;object-fit:cover}
.art-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px;opacity:.15}
.card-info{padding:10px}
.card-artist{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.card-title{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{color:var(--muted);font-size:11px;margin-top:4px}
.card-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.stars{color:var(--accent);font-size:11px}
.play-count{color:var(--muted);font-size:11px}
.mood-pill{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;margin-top:3px}
/* Wantlist shop link */
.shop-link{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:600;text-decoration:none;padding:2px 0;transition:color .15s}
.shop-link:hover,.shop-link:active{color:var(--accent)}
/* Full-page overlay */
.fullpage-overlay{position:fixed;inset:0;background:var(--bg);z-index:200;display:none;flex-direction:column;overflow-y:auto;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));transition:transform .2s ease-out}
.fullpage-overlay.swiping{transition:none}
.fullpage-overlay.open{display:flex}
.fullpage-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.fullpage-title{font-size:18px;font-weight:700}
.fullpage-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:24px;padding:4px;display:flex;align-items:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.fullpage-body{padding:20px;flex:1}
/* Album detail overlay */
#sheetOverlay{z-index:210}
.sheet-drag-handle{display:flex;justify-content:center;padding:10px 0 6px;position:sticky;top:0;background:var(--bg);z-index:10}
.drag-pill{width:36px;height:4px;border-radius:2px;background:var(--border)}
.modal-art{width:100%;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.modal-art img{width:100%;height:auto;display:block}
.modal-art-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:80px;opacity:.2}
.modal-body{padding:20px}
.modal-artist{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px}
.modal-title{font-size:22px;font-weight:700;line-height:1.2;margin-bottom:10px}
.modal-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.meta-chip{background:var(--surface2);border-radius:6px;color:var(--muted);font-size:12px;padding:4px 10px}
.play-info-row{color:var(--muted);font-size:12px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.play-info-row span{color:var(--text);font-weight:600}
.last-played-row{color:var(--muted);font-size:12px;margin-bottom:16px}
/* External links */
.external-links{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.ext-link{display:flex;align-items:center;justify-content:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:11px;font-weight:600;text-decoration:none;padding:10px 4px;transition:color .15s,border-color .15s;white-space:nowrap}
.ext-link:active{color:var(--text);border-color:var(--muted)}
/* Mood pills (read-only display) */
.mood-section{margin-bottom:16px}
.mood-label{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px}
.mood-pills-display{display:flex;gap:6px;flex-wrap:wrap}
.mood-pill-ro{text-align:center;border-radius:16px;font-family:var(--font);font-size:12px;font-weight:600;padding:6px 12px}
/* Notes (read-only) */
.notes-section{margin-bottom:16px}
.notes-label{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px}
.notes-display{color:var(--text);font-size:13px;line-height:1.6;padding:8px 10px;background:var(--surface2);border-radius:8px;border:1px solid var(--border)}
/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font-family:var(--font);font-size:13px;font-weight:600;padding:8px 14px;transition:all .15s;margin-bottom:-1px;-webkit-tap-highlight-color:transparent}
.tab.active{border-bottom-color:var(--accent);color:var(--text)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.track-list{list-style:none}
.track{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.track:last-child{border-bottom:none}
.track-pos{color:var(--muted);font-size:12px;min-width:24px;text-align:right}
.track-title{font-size:13px;flex:1}
.track-dur{color:var(--muted);font-size:12px}
.wiki-link{color:var(--accent);font-size:12px;display:inline-block;margin-top:6px}
/* Liner Notes tab (Sprint 3 §13) — replaces former About tab. Wikipedia bio
   preserved on Artist Page only per PRD §13.15. On share page the "Generated
   by Claude" footer is plain text (not tappable) — no transparency modal. */
.tab .spark{display:inline-block;margin-left:4px;color:var(--accent);opacity:.85}
.liner-notes-list{padding:6px 0 4px}
.liner-note{margin-bottom:18px}
.liner-note:last-of-type{margin-bottom:12px}
.liner-note-category{font-size:11px;font-weight:600;color:var(--muted);opacity:.75;margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}
.liner-note-body{color:var(--text);font-size:14px;line-height:1.55}
.liner-note-sources{font-size:11px;color:var(--muted);margin-top:4px}
.liner-note-sources a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.liner-notes-footer{display:block;font-size:11px;color:var(--muted);opacity:.7;padding:10px 0 4px;border-top:1px solid var(--border);margin-top:8px}
.liner-notes-placeholder{color:var(--muted);font-size:13px;font-style:italic;line-height:1.6;padding:8px 0 12px}
.loading-inline{color:var(--muted);font-size:13px;padding:12px 0;text-align:center}
/* Stats */
.stat-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stat-tile{border-radius:12px;padding:16px;cursor:pointer;transition:opacity .15s;position:relative;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.stat-tile:active{opacity:.8}
.stat-tile-label{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px;opacity:.8}
.stat-tile-value{font-size:32px;font-weight:700;line-height:1}
.stat-tile-sub{font-size:11px;margin-top:4px;opacity:.7}
.tile-red{background:#3a1212;color:#ff6b5b}
.tile-amber{background:#2e1f00;color:#f59e0b}
.tile-blue{background:#0d1f35;color:#60a5fa}
.tile-teal{background:#0a2420;color:#34d399}
.tile-purple{background:#1f1235;color:#a78bfa}
.tile-green{background:#0a2e14;color:#4ade80}
.tile-orange{background:#2e1a00;color:#fb923c}
.tile-rose{background:#2e0a1a;color:#fb7185}
.tile-indigo{background:#1a1a3a;color:#818cf8}
.tile-yellow{background:#2e2a00;color:#facc15}
.stat-list{margin-bottom:20px}
.stat-record-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;border-radius:8px;transition:background .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.stat-record-item:hover{background:var(--surface2)}
.stat-record-item:active{opacity:.7}
.stat-record-item:last-child{border-bottom:none}
.stat-record-art{width:40px;height:40px;border-radius:6px;background:var(--surface2);overflow:hidden;flex-shrink:0}
.stat-record-art img{width:100%;height:100%;object-fit:cover}
.stat-record-info{flex:1;min-width:0}
.stat-record-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-record-artist{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-record-meta{color:var(--muted);font-size:11px;white-space:nowrap}
.stat-agg-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.stat-agg-item:last-child{border-bottom:none}
.stat-agg-name{font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-agg-count{color:var(--muted);font-size:12px;white-space:nowrap;margin-left:12px}
/* Artist page */
.artist-hero{display:flex;align-items:center;gap:16px;padding:16px 0 20px}
.artist-hero-img{width:80px;height:80px;border-radius:50%;background:var(--surface2);overflow:hidden;flex-shrink:0}
.artist-hero-img img{width:100%;height:100%;object-fit:cover}
.artist-hero-img .artist-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--muted);opacity:.4}
.artist-hero-info{flex:1;min-width:0}
.artist-hero-name{font-size:20px;font-weight:700;line-height:1.2}
.artist-hero-sub{color:var(--muted);font-size:12px;margin-top:4px}
.artist-section{margin-bottom:24px}
.artist-section-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
.artist-bio{color:var(--muted);font-size:13px;line-height:1.7}
.artist-bio p{margin-bottom:8px}
.artist-stat-row{display:flex;gap:10px;margin-bottom:16px}
.artist-stat-box{flex:1;background:var(--surface2);border-radius:10px;padding:12px;text-align:center}
.artist-stat-val{font-size:24px;font-weight:700;color:var(--text)}
.artist-stat-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
.artist-disc-item{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;border-radius:8px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.artist-disc-item:hover{background:var(--surface2)}
.artist-disc-item:active{opacity:.7}
.artist-disc-item:last-child{border-bottom:none}
.artist-disc-art{width:44px;height:44px;border-radius:6px;background:var(--surface2);overflow:hidden;flex-shrink:0}
.artist-disc-art img{width:100%;height:100%;object-fit:cover}
.artist-disc-info{flex:1;min-width:0}
.artist-disc-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist-disc-meta{color:var(--muted);font-size:11px}
.artist-disc-plays{color:var(--muted);font-size:11px;white-space:nowrap;padding-right:4px}
.tappable-artist{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:2px}
.tappable-artist:active{opacity:.6}
/* Alpha scrubber */
.alpha-scrubber{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:90;display:flex;flex-direction:column;align-items:center;padding:6px 4px;background:rgba(22,22,22,.9);border-radius:12px 0 0 12px;backdrop-filter:blur(6px);opacity:0;transition:opacity .25s;pointer-events:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.alpha-scrubber.visible{opacity:1;pointer-events:auto}
.alpha-scrubber span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);min-height:34px;min-width:32px;padding:0 6px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:6px;white-space:nowrap}
.alpha-scrubber span:active,.alpha-scrubber span.active{color:var(--accent);background:rgba(232,55,44,.15)}
.alpha-jump-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;font-weight:800;color:#fff;opacity:0;transition:opacity .4s ease-out;pointer-events:none;z-index:91;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.alpha-jump-toast.show{opacity:.7;transition:opacity .08s ease-in}
/* Loading */
.page-loading{text-align:center;padding:80px 20px;color:var(--muted)}
.page-loading .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
/* Responsive desktop layout for album detail */
@media(max-width:400px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:768px){.sheet-layout{display:flex;gap:32px;align-items:flex-start}.sheet-layout .modal-art{width:45%;flex-shrink:0;position:sticky;top:72px;max-width:none;margin:0}.sheet-layout .modal-art img{width:100%;border-radius:12px}.sheet-layout .fullpage-body{flex:1;min-width:0}}
/* Stat tappable artist items */
.stat-agg-item.tappable{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.stat-agg-item.tappable:hover{background:var(--surface2)}
.stat-agg-item.tappable:active{opacity:.7}
.nav-btn{padding:6px 8px;min-width:56px}
.alpha-scrubber.visible.scroll-fade{opacity:.25}
/* Cycle progress (parity with /vinyl Crate view) */
.crate-progress{text-align:center;margin-bottom:12px}
.crate-bar-wrap{background:var(--surface2);border-radius:4px;height:4px;margin:0 auto 6px;max-width:280px;overflow:hidden}
.crate-bar{background:var(--accent);height:100%;border-radius:4px;transition:width .4s}
.crate-label{color:var(--muted);font-size:12px}
.crate-label span{color:var(--text);font-weight:600}
/* Stats — Cycle played + Mood Patterns tiles */
.tile-emerald{background:#082820;color:#5eead4}
.tile-mood-patterns{background:var(--surface2);color:var(--text)}
.tile-mood-patterns .stat-tile-label,.tile-mood-patterns .stat-tile-sub{color:var(--muted)}
.tile-mood-patterns .mini-donut{display:flex;align-items:center;justify-content:center;height:48px;margin:4px 0}
.tile-mood-patterns .mini-donut svg{width:48px;height:48px;display:block}
/* Recent plays — Listening Timeline (read-only port of /vinyl §9.7) */
.recent-row{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:8px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.recent-row:hover{background:var(--surface2)}
.recent-row:active{opacity:.7}
.recent-art{width:48px;height:48px;border-radius:6px;background:var(--surface2);overflow:hidden;flex-shrink:0}
.recent-art img{width:100%;height:100%;object-fit:cover;display:block}
.recent-info{flex:1;min-width:0}
.recent-title{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-artist{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.recent-when{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.recent-mood-pill{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;padding:3px 8px;border-radius:10px;line-height:1}
.recent-mood-pills{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:160px}
.recent-bucket-header{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 8px 6px;display:flex;align-items:center;gap:6px}
.recent-bucket-header.collapsible{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.recent-bucket-header.collapsible:hover{color:var(--text)}
.recent-bucket-caret{display:inline-block;font-size:9px;opacity:.6;transition:transform .15s}
.recent-bucket-header.collapsed .recent-bucket-caret{transform:rotate(-90deg)}
/* Mood Patterns sub-page (read-only port of /vinyl §9 Step 6) */
#moodPatternsOverlay{position:fixed;inset:0;background:var(--bg);z-index:195;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s ease-out;overflow:hidden;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
#moodPatternsOverlay.open{transform:translateX(0)}
#moodPatternsOverlay .mp-header{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10;flex-shrink:0}
#moodPatternsOverlay .mp-back{background:none;border:none;color:var(--text);font-size:28px;line-height:1;padding:0 8px;cursor:pointer}
#moodPatternsOverlay .mp-title{font-size:18px;font-weight:700}

<!-- Supabase client + API wrappers (replaces api.php). Module is implicitly deferred. -->
<script>window.crateReady = new Promise(r => { window._crateReadyResolve = r; });</script>
<script type="module" src="/lib/supabase.js"></script>

<script>
const $=id=>document.getElementById(id);

// Mood vocabulary comes from the owner's vinyl_user_moods via the public_moods
// view — never hardcode it here, or the share page drifts every time the owner
// renames or recolors a mood. Palette mirrors MOOD_COLOR_PALETTE in /vinyl.
const MOOD_COLOR_PALETTE={
  red:    {fg:'#ef4444', bg:'#4a1515'},
  amber:  {fg:'#fbbf24', bg:'#3d2800'},
  teal:   {fg:'#2dd4bf', bg:'#0a2e20'},
  blue:   {fg:'#3b82f6', bg:'#1e3a5f'},
  indigo: {fg:'#818cf8', bg:'#2d1b5e'},
  rose:   {fg:'#fb7185', bg:'#4a0a1a'},
};
let MOODS=[];

function buildMoods(rows){
  return (rows||[]).map(m=>{
    const pal=MOOD_COLOR_PALETTE[m.color_key]||MOOD_COLOR_PALETTE.blue;
    return {id:m.slug, label:m.mood_name, color:pal.fg, bg:pal.bg, sort_order:m.sort_order||0};
  });
}

let collection=[],filtered=[],artCache={},genreCache={},moodCache={},notesCache={},wikiCache={},artistsDB={};
// Liner notes caches (Sprint 3 §13) — read-only on share page, populated
// from vinyl_meta via the owner's RLS-gated anon read.
let linerNotesCache={},linerNotesStatusCache={};
let playCounts={},cycleLog={},lastPlayed={},currentCycle=1;
// Play history (public_play_events, newest first). One read powers Mood
// Patterns, the Recent timeline, and "This cycle N" on album detail.
let playEvents=[],cycleCounts={},cycleStartedAt=null;
let moodMixAllTime={counts:{},totalPlays:0};
let sortMode='alpha',sortIdx=0,activeMoodFilter='all';
let activeView='crate',currentRecord=null;

// v1.1 / Sprint 1 item 2 — share page is now multi-tenant. Resolve a slug
// from the URL ?slug= param (set by the Crate vercel.json rewrite for
// /share/:slug). Fall back to 'elbrink' so the legacy /crate URL still
// renders Todd's collection during the deploy gap before the hub 301 lands.
const URL_SLUG=(new URLSearchParams(location.search).get('slug')||'').toLowerCase()||'elbrink';
let ownerUserId=null;          // resolved at boot via crate.loadProfileBySlug
let ownerCrateName='';         // rendered into wordmark, page title, OG tags

const sortModes=['alpha','date_desc','date_asc','rating','year','plays','plays_asc'];
const sortLabels=['Artist A-Z','Date Added \u2193','Date Added \u2191','Rating \u2193','Year \u2193','Play Count \u2193','Play Count \u2191'];

// Wantlist
let wantlist=[],wantFiltered=[],wantlistArtCache={};
let wantSortMode='alpha',wantSortIdx=0;
const wantSortModes=['alpha','date_desc','date_asc','year'];
const wantSortLabels=['Artist A-Z','Date Added \u2193','Date Added \u2191','Year \u2193'];

// ---- Data loading ----

// Render the owner's crate_name across the page surfaces (header wordmark,
// browser title, OG meta tags). Mirrors the renderCrateName() logic in the
// private app: if the name ends with " Crate", keep the last word in the
// accent <em> styling.
function renderOwnerCrateName(){
  const name=ownerCrateName||"Elbrink's Crate";
  document.title=name;
  const wordmark=document.querySelector('.logo span');
  if(wordmark){
    const idx=name.toLowerCase().lastIndexOf(' crate');
    if(idx>0 && idx===name.length-6){
      wordmark.innerHTML=`${name.slice(0,idx)} <em>Crate</em>`;
    }else{
      wordmark.innerHTML=name;
    }
  }
  // OG / description meta — keep social previews accurate per profile.
  const ogTitle=document.querySelector('meta[property="og:title"]');
  if(ogTitle)ogTitle.setAttribute('content',name);
  const ogDesc=document.querySelector('meta[property="og:description"]');
  if(ogDesc)ogDesc.setAttribute('content',`Vinyl collection: ${name}. Browse the crate, explore stats, and see what's spinning.`);
  const desc=document.querySelector('meta[name="description"]');
  if(desc)desc.setAttribute('content',`Vinyl collection: ${name}. Browse the crate, explore stats, and see what's spinning.`);
}

// Render the not-found state when a slug doesn't resolve to a profile.
// Doesn't leak whether the slug exists but is share-off vs. doesn't exist
// at all — both look identical, so a removed share page goes opaque.
function renderShareNotFound(){
  const loading=document.getElementById('pageLoading');
  if(loading){
    loading.innerHTML=`
      <div style="font-size:18px;font-weight:600;color:var(--text);margin-bottom:8px">Page not found.</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.5;max-width:320px;text-align:center">No public crate at this address. The owner may have taken it down or the link may be mistyped.</div>
    `;
  }
}

async function loadAllData(){
  try{
    // Resolve slug -> profile first. Everything downstream filters by owner_id.
    const profRes=await crate.loadProfileBySlug(URL_SLUG);
    if(!profRes.success||!profRes.data){
      renderShareNotFound();
      return;
    }
    ownerUserId=profRes.data.user_id;
    ownerCrateName=profRes.data.crate_name||"Elbrink's Crate";
    cycleStartedAt=profRes.data.cycle_started_at||null;
    renderOwnerCrateName();

    const [colRes,metaRes,playRes,artistRes,moodRes,eventRes]=await Promise.all([
      crate.loadCollection({userId:ownerUserId}),
      crate.loadMeta({userId:ownerUserId}),
      crate.loadPlays({userId:ownerUserId}),
      crate.loadArtists({userId:ownerUserId}),
      crate.loadPublicMoods({userId:ownerUserId}),
      crate.loadPublicPlayEvents({userId:ownerUserId}),
    ]);

    if(moodRes.success)MOODS=buildMoods(moodRes.data);
    if(eventRes.success)playEvents=eventRes.data||[];
    derivePlayEventData();

    // Collection
    if(colRes.success&&colRes.data){
      collection=colRes.data.map(normalizeRelease).filter(Boolean);
    }

    // Metadata
    if(metaRes.success&&metaRes.data){
      Object.entries(metaRes.data).forEach(([id,m])=>{
        if(m.art_url)artCache[id]=m.art_url;
        if(m.genres&&m.genres.length)genreCache[id]=m.genres;
        if(m.moods&&m.moods.length)moodCache[id]=m.moods;
        if(m.notes)notesCache[id]=m.notes;
        if(m.artist_wiki_url)wikiCache[id]=m.artist_wiki_url;
        // Sprint 3 §13: Liner Notes (parity with PWA)
        if(Array.isArray(m.liner_notes))linerNotesCache[id]=m.liner_notes;
        linerNotesStatusCache[id]=m.liner_notes_status||'pending';
      });
    }

    // Play data
    if(playRes.success&&playRes.data){
      Object.entries(playRes.data).forEach(([id,p])=>{
        playCounts[id]=p.play_count||0;
        lastPlayed[id]=p.last_played||'';
        cycleLog[id]=p.cycle_played||false;
      });
    }

    // Artists
    if(artistRes.success&&artistRes.data){
      artistsDB=artistRes.data;
    }

    // Detect current cycle (anon-readable subset of vinyl_settings via the public_settings view)
    const settings=await crate.loadPublicSettings();
    if(settings.success&&settings.data&&settings.data.cycle)currentCycle=parseInt(settings.data.cycle)||1;

    // Load wantlist from Discogs (public, no auth needed for basic info)
    // Wantlist is stored in collection table only, not separately. Skip for now.

    $('pageLoading').style.display='none';
    $('bottomNav').style.display='flex';
    $('collectionView').style.display='block';
    filtered=[...collection];
    applySort();
    renderGrid();
    updateCrateProgress();
    updateScrubber();
  }catch(e){
    $('pageLoading').innerHTML='<div style="font-size:13px;color:var(--accent)">Failed to load collection. Try refreshing.</div>';
  }
}

function normalizeRelease(r){
  if(!r)return null;
  return{
    releaseId:r.releaseId||r.id||'',
    title:r.title||'',
    artist:r.artist||'',
    artistId:r.artistId||'',
    year:r.year||'',
    label:r.label||'',
    format:r.format||'',
    rating:r.rating||0,
    dateAdded:r.dateAdded||'',
    coverImage:r.coverImage||'',
    mediaCondition:r.mediaCondition||'',
    sleeveCondition:r.sleeveCondition||'',
    discogsNotes:r.discogsNotes||'',
    wantlistId:r.wantlistId||'',
    discogsUrl:r.discogsUrl||'',
  };
}

// Normalize mood_active to an array (jsonb array since Sprint 3 §9 Step 2;
// any older string survivors get wrapped defensively). Same as /vinyl.
function moodActiveArray(ev){
  if(Array.isArray(ev.mood_active))return ev.mood_active;
  if(typeof ev.mood_active==='string'&&ev.mood_active.length)return [ev.mood_active];
  return [];
}

// {counts:{slug:n}, totalPlays} — multi-mood plays credit each slug, null-mood
// plays are skipped. Client-side twin of crate.loadMoodEventCounts, including
// its array-only read of mood_active (test/share-parity.test.mjs holds the two
// together).
function countMoodEvents(events){
  const counts={};let totalPlays=0;
  for(const ev of events){
    const moods=Array.isArray(ev.mood_active)?ev.mood_active:[];
    if(!moods.length)continue;
    totalPlays+=1;
    for(const slug of moods){if(slug)counts[slug]=(counts[slug]||0)+1;}
  }
  return {counts,totalPlays};
}

// Derive everything the owner app fetches with six event queries from the one
// public_play_events read: cycle counts, the three mood-mix windows, last play
// per mood, most-played per mood, and the recent window the streak and
// day/time/balance tiles scan (500, matching /vinyl's loadRecentPlays limit).
function derivePlayEventData(){
  const since=cycleStartedAt?new Date(cycleStartedAt).getTime():null;
  const d30=Date.now()-30*24*60*60*1000;
  const inCycle=since?playEvents.filter(ev=>new Date(ev.played_at).getTime()>=since):playEvents;

  cycleCounts={};
  inCycle.forEach(ev=>{cycleCounts[ev.release_id]=(cycleCounts[ev.release_id]||0)+1;});

  const lastByMood={},perMood={};
  playEvents.forEach(ev=>{
    if(!Array.isArray(ev.mood_active))return;
    ev.mood_active.forEach(slug=>{
      if(!slug)return;
      if(ev.played_at&&(!lastByMood[slug]||new Date(ev.played_at)>new Date(lastByMood[slug])))lastByMood[slug]=ev.played_at;
      const bucket=perMood[slug]||(perMood[slug]={});
      bucket[ev.release_id]=(bucket[ev.release_id]||0)+1;
    });
  });
  const mostPlayed={};
  Object.keys(perMood).forEach(slug=>{
    const top=Object.entries(perMood[slug]).sort((a,b)=>b[1]-a[1])[0];
    if(top)mostPlayed[slug]={release_id:top[0],count:top[1]};
  });

  _mpData={
    all:countMoodEvents(playEvents),
    d30:countMoodEvents(playEvents.filter(ev=>new Date(ev.played_at).getTime()>=d30)),
    cycle:countMoodEvents(inCycle),
    lastPlayed:lastByMood,
    mostPlayed,
    recentForStreak:playEvents.slice(0,500),
  };
  moodMixAllTime=_mpData.all;
}

// Visitor shuffle — a random pick from the whole crate, narrowed by the active
// mood filter. (The owner's unplayed-this-cycle mode is a listening rule, not
// a browsing one, so it doesn't carry over.)

  let pool=collection;

function renderGrid(){
  const g=$('grid');
  $('countBadge').textContent=filtered.length+' records';
  if(!filtered.length){g.innerHTML='<div style="text-align:center;padding:40px;color:var(--muted)">No records found</div>';return;}

    const moodPill=known.length?known.slice(0,2).map(m=>`<span class="mood-pill" style="background:${m.bg};color:${m.color}">${m.label}</span>`).join(' ')+(known.length>2?` <span class="mood-pill" style="background:var(--surface2);color:var(--muted)">+${known.length-2}</span>`:''):'';

}

// ---- Sorting ----
function applySort(){
  const mode=sortModes[sortIdx];
  if(mode==='alpha')filtered.sort((a,b)=>(a.artist||'').localeCompare(b.artist||''));
  else if(mode==='date_desc')filtered.sort((a,b)=>new Date(b.dateAdded||0)-new Date(a.dateAdded||0));
  else if(mode==='date_asc')filtered.sort((a,b)=>new Date(a.dateAdded||0)-new Date(b.dateAdded||0));
  else if(mode==='rating')filtered.sort((a,b)=>(b.rating||0)-(a.rating||0));
  else if(mode==='year')filtered.sort((a,b)=>(parseInt(b.year)||0)-(parseInt(a.year)||0));
  else if(mode==='plays')filtered.sort((a,b)=>(playCounts[b.releaseId]||0)-(playCounts[a.releaseId]||0));
  else if(mode==='plays_asc')filtered.sort((a,b)=>(playCounts[a.releaseId]||0)-(playCounts[b.releaseId]||0));
}

// Web-sourced notes carry the search result URLs they relied on. Links show
// the bare hostname; notes written from Claude's own knowledge have none.
function linerNoteSourcesEl(note){
  // One link per site: two Wikipedia pages read as a stutter, so the first wins.
  const bySite=new Map();
  (Array.isArray(note&&note.sources)?note.sources:[]).forEach(u=>{
    try{const host=new URL(u).hostname.replace(/^www\./,'');if(/^https?:$/.test(new URL(u).protocol)&&!bySite.has(host))bySite.set(host,u);}catch{}
  });
  if(!bySite.size)return null;
  const el=document.createElement('div');el.className='liner-note-sources';
  el.appendChild(document.createTextNode('Source: '));
  [...bySite].forEach(([host,u],i)=>{
    if(i)el.appendChild(document.createTextNode(' · '));
    const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.textContent=host;
    el.appendChild(a);
  });
  return el;
}

// Render the album-detail Liner Notes tab from cached state (Sprint 3 \u00a713).
// Read-only on share page \u2014 no flag-as-wrong, no transparency modal.
function renderLinerNotes(releaseId){
  const el=$('linerNotesList');
  if(!el)return;
  el.innerHTML='';
  const status=linerNotesStatusCache[releaseId]||'pending';
  const notes=linerNotesCache[releaseId];
  if(status==='generated'&&Array.isArray(notes)&&notes.length){
    notes.forEach(n=>{
      const wrap=document.createElement('div');wrap.className='liner-note';
      const cat=document.createElement('div');cat.className='liner-note-category';cat.textContent=n.category||'';
      const body=document.createElement('div');body.className='liner-note-body';body.textContent=n.body||'';
      wrap.appendChild(cat);wrap.appendChild(body);
      const sources=linerNoteSourcesEl(n);
      if(sources)wrap.appendChild(sources);
      el.appendChild(wrap);
    });
    const footer=document.createElement('div');
    footer.className='liner-notes-footer';
    footer.textContent='Generated by Claude';
    el.appendChild(footer);
  }else{
    const ph=document.createElement('div');
    ph.className='liner-notes-placeholder';
    if(status==='low_confidence'){
      ph.textContent="Liner notes for this record aren't available. Claude chose silence over guessing — likely a recent, regional, or limited-data release. Better than wrong content.";
    }else{
      ph.textContent="Liner notes for this record aren't available yet.";
    }
    el.appendChild(ph);
  }
}

// Swipe-down-to-close for overlays
['sheetOverlay','statDrillOverlay','artistOverlay'].forEach(id=>{
  const el=$(id);
  let startY=0,currentY=0,dragging=false;
  el.addEventListener('touchstart',e=>{
    if(el.scrollTop>5)return;
    startY=e.touches[0].clientY;dragging=true;
    el.classList.add('swiping');
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!dragging)return;
    currentY=e.touches[0].clientY;
    const dy=currentY-startY;
    if(dy>0)el.style.transform='translateY('+dy+'px)';
  },{passive:true});
  el.addEventListener('touchend',()=>{
    if(!dragging)return;
    dragging=false;el.classList.remove('swiping');
    const dy=currentY-startY;
    el.style.transform='';
    if(dy>100){
      if(id==='sheetOverlay')closeSheet();
      else if(id==='statDrillOverlay')$('statDrillOverlay').classList.remove('open');
      else if(id==='artistOverlay')$('artistOverlay').classList.remove('open');
    }
    startY=0;currentY=0;
  },{passive:true});
});

function openStatDrill(tile){
  const playedRecords=collection.filter(r=>playCounts[r.releaseId]>0);
  const unplayedRecords=collection.filter(r=>!playCounts[r.releaseId]);
  const cycleRemaining=collection.filter(r=>!cycleLog[r.releaseId]);
  let title='',html='';

  if(tile==='plays'){
    title='Most Played';
    const list=[...playedRecords].sort((a,b)=>(playCounts[b.releaseId]||0)-(playCounts[a.releaseId]||0)).slice(0,20);
    html=renderRecordList(list);
  }else if(tile==='played'){
    title='Played Records';
    html=renderRecordList([...playedRecords].sort((a,b)=>new Date(lastPlayed[b.releaseId]||0)-new Date(lastPlayed[a.releaseId]||0)));
  }else if(tile==='unplayed'){
    title='Unplayed Records';
    html=renderRecordList(unplayedRecords);
  }else if(tile==='cycle'){
    title='Remaining This Cycle';
    html=renderRecordList(cycleRemaining);
  }else if(tile==='cycleplayed'){
    title='Played This Cycle';
    html=renderRecordList(collection.filter(r=>cycleLog[r.releaseId]).sort((a,b)=>new Date(lastPlayed[b.releaseId]||0)-new Date(lastPlayed[a.releaseId]||0)));
  }else if(tile==='topartist'){
    title='Artists by Plays';
    const ap={};const aim={};
    collection.forEach(r=>{const a=r.artist||'Unknown';ap[a]=(ap[a]||0)+(playCounts[r.releaseId]||0);if(r.artistId)aim[a]=r.artistId;});
    html=renderAggList(Object.entries(ap).sort((a,b)=>b[1]-a[1]).filter(a=>a[1]>0),true,aim);
  }else if(tile==='topgenre'){
    title='Genres by Plays';
    const gp={};
    collection.forEach(r=>{(genreCache[r.releaseId]||[]).forEach(g=>{gp[g]=(gp[g]||0)+(playCounts[r.releaseId]||0);});});
    html=renderAggList(Object.entries(gp).sort((a,b)=>b[1]-a[1]).filter(g=>g[1]>0),true);
  }else if(tile==='artists'){
    title='All Artists';
    const ct={};const aim={};
    collection.forEach(r=>{const a=r.artist||'Unknown';ct[a]=(ct[a]||0)+1;if(r.artistId)aim[a]=r.artistId;});
    html=renderAggList(Object.entries(ct).sort((a,b)=>b[1]-a[1]).map(([n,c])=>[n,c+' record'+(c!==1?'s':'')]),false,aim);
  }else if(tile==='genres'){
    title='All Genres';
    const ct={};Object.values(genreCache).forEach(g=>(g||[]).forEach(x=>{ct[x]=(ct[x]||0)+1;}));
    html=renderAggList(Object.entries(ct).sort((a,b)=>b[1]-a[1]).map(([n,c])=>[n,c+' record'+(c!==1?'s':'')]),false);
  }else if(tile==='topdecade'){
    // Records from the top decade, sorted by year then artist
    const decadeCounts={};
    collection.forEach(r=>{const y=parseInt(r.year);if(y&&y>=1900){const d=Math.floor(y/10)*10;decadeCounts[d]=(decadeCounts[d]||0)+1;}});
    const top=Object.entries(decadeCounts).sort((a,b)=>b[1]-a[1])[0];
    if(top){
      const decade=parseInt(top[0]);
      title=decade+'s Records';
      const records=collection.filter(r=>{const y=parseInt(r.year);return y>=decade&&y<decade+10;}).sort((a,b)=>{const ay=parseInt(a.year)||0,by=parseInt(b.year)||0;return ay-by||(a.artist||'').localeCompare(b.artist||'');});
      html=renderRecordList(records);
    }
  }

  if(!html)html='<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">No records to show</div>';
  $('drillHeaderTitle').textContent=title;
  $('drillContent').innerHTML=html;
  $('statDrillOverlay').classList.add('open');
  $('statDrillOverlay').scrollTop=0;
  wireDrillTaps();
}

// Tile renderers and drills below are carried over from /vinyl; _mpData is
// filled by derivePlayEventData() instead of per-open event queries.
function buildMoodDonutSvg({counts, totalPlays}, opts={}){
  const size=opts.size||96;
  const strokeWidth=opts.strokeWidth||(size*0.20);
  const r=(size/2)-(strokeWidth/2);
  const cx=size/2, cy=size/2;
  const circumference=2*Math.PI*r;
  if(!totalPlays){
    return `<svg viewBox="0 0 ${size} ${size}" aria-label="No mood data yet"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border)" stroke-width="${strokeWidth}" opacity="0.6"/></svg>`;
  }
  const entries=Object.entries(counts).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]);
  let offset=0;
  const arcs=entries.map(([slug,count])=>{
    const m=MOODS.find(x=>x.id===slug);
    const color=m?m.color:'#71717a';
    const len=(count/totalPlays)*circumference;
    const dasharray=`${len} ${circumference-len}`;
    const dashoffset=-offset;
    offset+=len;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-dasharray="${dasharray}" stroke-dashoffset="${dashoffset}" transform="rotate(-90 ${cx} ${cy})"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" aria-label="Mood mix donut">${arcs}</svg>`;
}

// Returns {slug, gapDays|null, neverPlayed:bool, waiting:n} for the most
// forgotten mood, or null if no mood qualifies. "Most forgotten" = never-played
// first, then largest gap-from-today among moods with at least one tagged
// record in the user's collection. Backfill events already excluded server-side.
function pickForgottenMood(){
  if(!MOODS.length)return null;
  // Tagged-record count per mood from moodCache (vinyl_meta.moods)
  const taggedCount={};
  collection.forEach(r=>{
    (moodCache[r.releaseId]||[]).forEach(slug=>{
      taggedCount[slug]=(taggedCount[slug]||0)+1;
    });
  });
  // Eligible moods: must have at least one tagged record
  const eligible=MOODS.filter(m=>taggedCount[m.id]>0);
  if(!eligible.length)return null;
  const now=Date.now();
  const ranked=eligible.map(m=>{
    const last=_mpData.lastPlayed?.[m.id];
    const gapDays=last?Math.floor((now-new Date(last).getTime())/(24*60*60*1000)):null;
    // Unplayed = lifetime-never-played records tagged with this mood
    const waiting=collection.filter(r=>{
      const tagged=(moodCache[r.releaseId]||[]).indexOf(m.id)!==-1;
      const neverPlayed=!(playCounts[r.releaseId]>0);
      return tagged&&neverPlayed;
    }).length;
    return {slug:m.id,gapDays,neverPlayed:!last,waiting,mood:m};
  });
  // Sort: never-played first, then largest gap
  ranked.sort((a,b)=>{
    if(a.neverPlayed&&!b.neverPlayed)return -1;
    if(b.neverPlayed&&!a.neverPlayed)return 1;
    return (b.gapDays||0)-(a.gapDays||0);
  });
  return ranked[0];
}

}

// Returns {slug, count, plays:[event,...], kind:'current'|'longest30d'} or null.
// 'current': most-recent contiguous run of plays sharing any mood overlap,
// length >=2. 'longest30d': longest such run within last 30d if no current.
// Rules: null mood_active SKIPS (no signal), no overlap BREAKS, overlap CONTINUES.
function computeStreak(){
  const events=(_mpData.recentForStreak||[]).slice();
  if(!events.length)return null;
  // Events come back played_at desc already (per loadRecentPlays). Reverse-scan
  // so we walk most-recent → older.
  // -- Current streak: anchor on most recent non-null-mood play
  let currentRun=null;
  let anchorMood=null;
  let runningPlays=[];
  for(const ev of events){
    const moods=moodActiveArray(ev);
    if(!moods.length)continue; // skip — no signal
    if(!anchorMood){
      // first qualifying play — try each of its moods as candidate anchor; pick
      // the one that yields the longest current streak walking back from here.
      let best=null;
      for(const candidate of moods){
        const run=[ev];
        for(const next of events.slice(events.indexOf(ev)+1)){
          const nextMoods=moodActiveArray(next);
          if(!nextMoods.length)continue;
          if(nextMoods.indexOf(candidate)!==-1){run.push(next);}
          else break;
        }
        if(!best||run.length>best.run.length)best={slug:candidate,run};
      }
      currentRun=best;
      break;
    }
  }
  if(currentRun&&currentRun.run.length>=2){
    return {slug:currentRun.slug,count:currentRun.run.length,plays:currentRun.run,kind:'current'};
  }
  // -- Longest streak in last 30d
  const cutoff=Date.now()-30*24*60*60*1000;
  const recent=events.filter(ev=>new Date(ev.played_at).getTime()>=cutoff);
  if(!recent.length)return null;
  // For each mood slug, scan recent events oldest→newest tracking the longest
  // contiguous overlapping run.
  const slugSet=new Set();
  recent.forEach(ev=>moodActiveArray(ev).forEach(s=>slugSet.add(s)));
  let bestOverall=null;
  for(const slug of slugSet){
    let curr=0, currPlays=[], best=0, bestPlays=[];
    // Walk oldest→newest within recent window
    const ordered=[...recent].reverse();
    for(const ev of ordered){
      const moods=moodActiveArray(ev);
      if(!moods.length)continue; // skip
      if(moods.indexOf(slug)!==-1){curr+=1;currPlays.push(ev);if(curr>best){best=curr;bestPlays=[...currPlays];}}
      else{curr=0;currPlays=[];}
    }
    if(best>=2&&(!bestOverall||best>bestOverall.count)){
      bestOverall={slug,count:best,plays:bestPlays,kind:'longest30d'};
    }
  }
  return bestOverall;
}

// ----------------------------------------------------------------------------
// Phase 6.3 — Tiles 6 (Day of Week) + 7 (Time of Day) + 8 (Balance Over Time)
// All three use graceful degradation across low/medium/high data states per
// PRD §9.5/§9.6. Threshold-switching only; animated transition deferred to
// v1.2 (locked Session 40 CC). All data derived client-side from
// _mpData.recentForStreak (already loaded, limit 500); no new wrappers.
// Multi-mood plays credit ALL involved moods (consistent with Tiles 1/3/4).
// Backfill events excluded; null-mood plays skipped (no signal).
// ----------------------------------------------------------------------------

// Pure aggregation — returns 7-element array indexed Sun-Sat.
function buildDayOfWeekData(events){
  const days=Array.from({length:7},()=>({total:0,byMood:{}}));
  events.forEach(ev=>{
    const moods=moodActiveArray(ev);
    const d=new Date(ev.played_at).getDay();
    days[d].total+=1;
    moods.forEach(slug=>{days[d].byMood[slug]=(days[d].byMood[slug]||0)+1;});
  });
  return days;
}

// Pure aggregation — returns 24-element array indexed 0-23.
function buildTimeOfDayData(events){
  const hours=Array.from({length:24},()=>({total:0,byMood:{}}));
  events.forEach(ev=>{
    const moods=moodActiveArray(ev);
    const h=new Date(ev.played_at).getHours();
    hours[h].total+=1;
    moods.forEach(slug=>{hours[h].byMood[slug]=(hours[h].byMood[slug]||0)+1;});
  });
  return hours;
}

// Pure aggregation — returns sorted-asc array of {weekStartIso,label,total,byMood}.
// Week starts on Sunday (local time).
function buildBalanceOverTimeData(events){
  const map={};
  events.forEach(ev=>{
    const moods=moodActiveArray(ev);
    const d=new Date(ev.played_at);
    const sunday=new Date(d);
    sunday.setHours(0,0,0,0);
    sunday.setDate(sunday.getDate()-sunday.getDay());
    const key=sunday.toISOString().slice(0,10);
    if(!map[key])map[key]={weekStartIso:key,total:0,byMood:{}};
    map[key].total+=1;
    moods.forEach(slug=>{map[key].byMood[slug]=(map[key].byMood[slug]||0)+1;});
  });
  const sorted=Object.values(map).sort((a,b)=>a.weekStartIso.localeCompare(b.weekStartIso));
  sorted.forEach(w=>{
    const d=new Date(w.weekStartIso+'T00:00:00');
    w.label=d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  });
  return sorted;
}

// SVG helper — vertical stacked bar chart. `buckets` = array of {total,byMood}.
// `labels` parallels buckets. Empty columns render a 2px floor for orientation.
function buildVertStackBarSvg(buckets,labels,opts={}){
  const w=opts.width||200,h=opts.height||80,gap=opts.gap||2,labelH=opts.labelH||12;
  const chartH=h-labelH-2;
  const n=buckets.length;
  const colW=(w-(n-1)*gap)/n;
  const maxTotal=Math.max(1,...buckets.map(b=>b.total));
  let svg=`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">`;
  buckets.forEach((bucket,i)=>{
    const x=i*(colW+gap);
    if(bucket.total===0){
      svg+=`<rect x="${x.toFixed(2)}" y="${(chartH-2).toFixed(2)}" width="${colW.toFixed(2)}" height="2" fill="${opts.emptyFill||'#27272a'}" rx="1"/>`;
    }else{
      let acc=0;
      Object.entries(bucket.byMood).forEach(([slug,count])=>{
        const m=MOODS.find(x=>x.id===slug)||{color:'#71717a'};
        const segH=(count/maxTotal)*chartH;
        svg+=`<rect x="${x.toFixed(2)}" y="${(chartH-acc-segH).toFixed(2)}" width="${colW.toFixed(2)}" height="${segH.toFixed(2)}" fill="${m.color}"/>`;
        acc+=segH;
      });
    }
    if(labels&&labels[i]!=null){
      svg+=`<text x="${(x+colW/2).toFixed(2)}" y="${(h-2).toFixed(2)}" font-size="${opts.labelFontSize||8}" fill="${opts.labelColor||'#71717a'}" text-anchor="middle">${labels[i]}</text>`;
    }
  });
  return svg+'</svg>';
}

// SVG helper — heatmap grid. moodSlugs = rows. buckets = cols (only used for
// count). matrix[slug][i] = count. Intensity by per-mood max so each mood's
// gradient reads independently against its own scale.
function buildHeatmapSvg(buckets,moodSlugs,matrix,labels,opts={}){
  const w=opts.width||200,h=opts.height||80,cellGap=opts.cellGap||1,labelH=opts.labelH||10;
  const chartH=h-labelH-2;
  const cols=buckets.length;
  const rows=moodSlugs.length;
  const cellW=(w-(cols-1)*cellGap)/cols;
  const cellH=(chartH-(rows-1)*cellGap)/rows;
  let svg=`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">`;
  moodSlugs.forEach((slug,rowI)=>{
    const m=MOODS.find(x=>x.id===slug)||{color:'#71717a'};
    const row=matrix[slug]||[];
    let rowMax=0;
    for(let i=0;i<cols;i++)if((row[i]||0)>rowMax)rowMax=row[i]||0;
    rowMax=rowMax||1;
    for(let i=0;i<cols;i++){
      const v=row[i]||0;
      const x=i*(cellW+cellGap);
      const y=rowI*(cellH+cellGap);
      const opacity=v===0?0.08:0.25+(v/rowMax)*0.75;
      svg+=`<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${cellW.toFixed(2)}" height="${cellH.toFixed(2)}" fill="${m.color}" opacity="${opacity.toFixed(2)}"/>`;
    }
  });
  if(labels&&labels.length===cols){
    labels.forEach((lbl,i)=>{
      if(!lbl)return;
      const x=i*(cellW+cellGap)+cellW/2;
      svg+=`<text x="${x.toFixed(2)}" y="${(h-2).toFixed(2)}" font-size="${opts.labelFontSize||7}" fill="${opts.labelColor||'#71717a'}" text-anchor="middle">${lbl}</text>`;
    });
  }
  return svg+'</svg>';
}

// SVG helper — multi-line chart. weeks = sorted-asc. One line per mood slug.
// y-axis = count for that week. x-axis = weeks evenly spaced.
function buildMultiLineSvg(weeks,moodSlugs,opts={}){
  const w=opts.width||300,h=opts.height||100,pad=opts.pad||8;
  const chartW=w-pad*2;
  const chartH=h-pad*2;
  const n=weeks.length;
  let max=0;
  weeks.forEach(week=>{moodSlugs.forEach(slug=>{const v=week.byMood[slug]||0;if(v>max)max=v;});});
  max=max||1;
  const xs=weeks.map((_,i)=>n===1?pad+chartW/2:pad+(i/(n-1))*chartW);
  let svg=`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">`;
  moodSlugs.forEach(slug=>{
    const m=MOODS.find(x=>x.id===slug)||{color:'#71717a'};
    const parts=[];
    weeks.forEach((week,i)=>{
      const v=week.byMood[slug]||0;
      const y=pad+chartH-(v/max)*chartH;
      parts.push((i===0?'M':'L')+xs[i].toFixed(1)+' '+y.toFixed(1));
    });
    svg+=`<path d="${parts.join(' ')}" fill="none" stroke="${m.color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  return svg+'</svg>';
}

// Tile 6 — Mood by Day of Week (graceful degradation: text → bars → heatmap).
function renderDayOfWeekTile(){
  const events=(_mpData.recentForStreak||[]).filter(ev=>moodActiveArray(ev).length>0);
  const n=events.length;
  const emptyHtml=`<div class="mp-tile" data-tile="dayofweek">
      <div class="mp-tile-label">Day of Week</div>
      <div class="mp-tile-empty">Play 5 records to see this take shape.</div>
    </div>`;
  if(n<5)return emptyHtml;
  const days=buildDayOfWeekData(events);
  if(n<30){
    const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    let bestDay=0;
    for(let i=1;i<7;i++)if(days[i].total>days[bestDay].total)bestDay=i;
    if(days[bestDay].total===0)return emptyHtml;
    const byMood=days[bestDay].byMood;
    const slugs=Object.keys(byMood);
    let bestSlug=slugs[0];
    slugs.forEach(s=>{if(byMood[s]>byMood[bestSlug])bestSlug=s;});
    const m=MOODS.find(x=>x.id===bestSlug)||{color:'var(--text)',label:bestSlug};
    return `<div class="mp-tile" data-tile="dayofweek">
      <div class="mp-tile-label">Day of Week</div>
      <div class="mp-textsum-body">
        <div class="mp-textsum-line">Mostly <strong>${dayNames[bestDay]}</strong>.</div>
        <div class="mp-textsum-secondary">Often <strong style="color:${m.color}">${m.label}</strong> on those plays.</div>
      </div>
    </div>`;
  }
  if(n<100){
    const labels=['S','M','T','W','T','F','S'];
    return `<div class="mp-tile" data-tile="dayofweek">
      <div class="mp-tile-label">Day of Week</div>
      <div class="mp-chart-wrap">${buildVertStackBarSvg(days,labels,{width:180,height:80})}</div>
    </div>`;
  }
  // HIGH — heatmap (only moods that have any plays render as rows)
  const usedSlugs=MOODS.map(m=>m.id).filter(slug=>days.some(d=>(d.byMood[slug]||0)>0));
  const matrix={};
  usedSlugs.forEach(slug=>{matrix[slug]=days.map(d=>d.byMood[slug]||0);});
  const labels=['S','M','T','W','T','F','S'];
  return `<div class="mp-tile" data-tile="dayofweek">
    <div class="mp-tile-label">Day of Week</div>
    <div class="mp-chart-wrap">${buildHeatmapSvg(days,usedSlugs,matrix,labels,{width:170,height:90})}</div>
  </div>`;
}

// Tile 7 — Mood by Time of Day (graceful degradation: text → bars → heatmap).
function renderTimeOfDayTile(){
  const events=(_mpData.recentForStreak||[]).filter(ev=>moodActiveArray(ev).length>0);
  const n=events.length;
  const emptyHtml=`<div class="mp-tile" data-tile="timeofday">
      <div class="mp-tile-label">Time of Day</div>
      <div class="mp-tile-empty">Play 5 records to see this take shape.</div>
    </div>`;
  if(n<5)return emptyHtml;
  const hours=buildTimeOfDayData(events);
  if(n<30){
    // LOW — collapse to 4 broad buckets
    const broad=[{label:'late night',s:0,e:5},{label:'morning',s:6,e:11},{label:'afternoon',s:12,e:17},{label:'evening',s:18,e:23}].map(b=>{
      let total=0;const byMood={};
      for(let h=b.s;h<=b.e;h++){total+=hours[h].total;Object.entries(hours[h].byMood).forEach(([s,c])=>{byMood[s]=(byMood[s]||0)+c;});}
      return {...b,total,byMood};
    });
    let best=broad[0];
    broad.forEach(b=>{if(b.total>best.total)best=b;});
    if(best.total===0)return emptyHtml;
    const slugs=Object.keys(best.byMood);
    let bestSlug=slugs[0];
    slugs.forEach(s=>{if(best.byMood[s]>best.byMood[bestSlug])bestSlug=s;});
    const m=MOODS.find(x=>x.id===bestSlug)||{color:'var(--text)',label:bestSlug};
    return `<div class="mp-tile" data-tile="timeofday">
      <div class="mp-tile-label">Time of Day</div>
      <div class="mp-textsum-body">
        <div class="mp-textsum-line">Mostly <strong>${best.label}</strong> plays.</div>
        <div class="mp-textsum-secondary">Often <strong style="color:${m.color}">${m.label}</strong> on those plays.</div>
      </div>
    </div>`;
  }
  if(n<100){
    // MEDIUM — 6 4-hour buckets
    const buckets=[];const labels=['12a','4a','8a','12p','4p','8p'];
    for(let i=0;i<6;i++){
      let total=0;const byMood={};
      for(let h=i*4;h<(i+1)*4;h++){total+=hours[h].total;Object.entries(hours[h].byMood).forEach(([s,c])=>{byMood[s]=(byMood[s]||0)+c;});}
      buckets.push({total,byMood});
    }
    return `<div class="mp-tile" data-tile="timeofday">
      <div class="mp-tile-label">Time of Day</div>
      <div class="mp-chart-wrap">${buildVertStackBarSvg(buckets,labels,{width:180,height:80})}</div>
    </div>`;
  }
  // HIGH — 24-hour heatmap
  const usedSlugs=MOODS.map(m=>m.id).filter(slug=>hours.some(h=>(h.byMood[slug]||0)>0));
  const matrix={};
  usedSlugs.forEach(slug=>{matrix[slug]=hours.map(h=>h.byMood[slug]||0);});
  const hourLabels=Array.from({length:24},(_,i)=>i%4===0?(i===0?'12a':i<12?i+'a':i===12?'12p':(i-12)+'p'):'');
  return `<div class="mp-tile" data-tile="timeofday">
    <div class="mp-tile-label">Time of Day</div>
    <div class="mp-chart-wrap">${buildHeatmapSvg(hours,usedSlugs,matrix,hourLabels,{width:210,height:90,labelFontSize:6})}</div>
  </div>`;
}

// Tile 8 — Mood Balance Over Time (graceful degradation: text → bars → multi-line).
// Spans full grid width (mp-balance class) for chart legibility per PRD §9.5.
function renderBalanceOverTimeTile(){
  const events=(_mpData.recentForStreak||[]).filter(ev=>moodActiveArray(ev).length>0);
  const emptyHtml=`<div class="mp-tile mp-balance" data-tile="balanceovertime">
      <div class="mp-tile-label">Balance Over Time</div>
      <div class="mp-tile-empty">Play across a couple of weeks to see this take shape.</div>
    </div>`;
  if(events.length===0)return emptyHtml;
  const weeks=buildBalanceOverTimeData(events);
  if(weeks.length===0)return emptyHtml;
  if(weeks.length<2){
    // LOW — single week so far
    const w=weeks[0];
    const ranked=Object.entries(w.byMood).sort((a,b)=>b[1]-a[1]);
    if(!ranked.length)return emptyHtml;
    const topSlug=ranked[0][0];
    const m=MOODS.find(x=>x.id===topSlug)||{color:'var(--text)',label:topSlug};
    return `<div class="mp-tile mp-balance" data-tile="balanceovertime">
      <div class="mp-tile-label">Balance Over Time</div>
      <div class="mp-textsum-body">
        <div class="mp-textsum-line">This week: <strong style="color:${m.color}">${m.label}</strong> heavy.</div>
        <div class="mp-textsum-secondary">Play across another week to see the shift.</div>
      </div>
    </div>`;
  }
  const usedSlugs=MOODS.map(m=>m.id).filter(slug=>weeks.some(w=>(w.byMood[slug]||0)>0));
  const legend=usedSlugs.map(slug=>{
    const m=MOODS.find(x=>x.id===slug)||{color:'#71717a',label:slug};
    return `<span class="leg"><span class="swatch" style="background:${m.color}"></span>${m.label}</span>`;
  }).join('');
  if(weeks.length<=8){
    // MEDIUM — per-week stacked bars
    const labels=weeks.map(w=>w.label);
    return `<div class="mp-tile mp-balance" data-tile="balanceovertime">
      <div class="mp-tile-label">Balance Over Time</div>
      <div class="mp-chart-wrap">${buildVertStackBarSvg(weeks,labels,{width:360,height:110})}</div>
      <div class="mp-chart-legend">${legend}</div>
    </div>`;
  }
  // HIGH — multi-line chart
  return `<div class="mp-tile mp-balance" data-tile="balanceovertime">
    <div class="mp-tile-label">Balance Over Time</div>
    <div class="mp-chart-wrap">${buildMultiLineSvg(weeks,usedSlugs,{width:360,height:120})}</div>
    <div class="mp-chart-legend">${legend}</div>
  </div>`;
}

function wireMoodPatternsTaps(){
  // Segmented control on Mood Mix tile
  $('moodPatternsGrid').querySelectorAll('.mp-segmented button').forEach(btn=>{
    btn.onclick=(e)=>{
      e.stopPropagation();
      _mpMixWindow=btn.dataset.win;
      renderMoodPatterns();
    };
  });
  // Tile 5 row taps → open album detail directly (PRD §9.5 Tile 5)
  $('moodPatternsGrid').querySelectorAll('.mp-mostplayed-row[data-id]').forEach(row=>{
    row.onclick=(e)=>{
      e.stopPropagation();
      const rec=collection.find(r=>r.releaseId===row.dataset.id);
      if(rec)openSheet(rec,false);
    };
  });
  // Tile taps → drill-down (skip segmented control + Tile 5 which has no drill)
  $('moodPatternsGrid').querySelectorAll('.mp-tile').forEach(tile=>{
    if(tile.dataset.tile==='mostplayed')return;
    tile.onclick=(e)=>{
      if(e.target.closest('.mp-segmented'))return;
      if(e.target.closest('.mp-mostplayed-row'))return;
      openMoodPatternDrill(tile.dataset.tile,tile.dataset);
    };
  });
}

function openMoodPatternDrill(which,data={}){
  let title='',win='all';
  if(which==='mix'){
    win=_mpMixWindow;
    const winLabel=win==='cycle'?'This Cycle':win==='30d'?'Last 30 Days':'All Time';
    title=`Mood Mix — ${winLabel}`;
  }else if(which==='cyclebalance'){
    title='Cycle Mood Balance';
    win='cycle';
  }else if(which==='forgotten'){
    const m=MOODS.find(x=>x.id===data.slug)||{label:data.slug||'Mood'};
    title=`${m.label} — Unplayed`;
  }else if(which==='streak'){
    const m=MOODS.find(x=>x.id===data.slug)||{label:data.slug||'Mood'};
    title=data.kind==='current'?`${m.label} streak`:`${m.label} streak — last 30 days`;
  }else if(which==='dayofweek'){
    title='Plays by Day of Week';
  }else if(which==='timeofday'){
    title='Plays by Time of Day';
  }else if(which==='balanceovertime'){
    title='Mood Balance Over Time';
  }
  $('drillHeaderTitle').textContent=title;
  $('drillContent').innerHTML='<div style="color:var(--muted);font-size:12px;text-align:center;padding:20px">Loading…</div>';
    $('statDrillOverlay').classList.add('open');
  $('statDrillOverlay').scrollTop=0;
  if(which==='forgotten')fillForgottenDrill(data.slug);
  else if(which==='streak')fillStreakDrill(data.slug,data.kind);
  else if(which==='dayofweek')fillDayOfWeekDrill();
  else if(which==='timeofday')fillTimeOfDayDrill();
  else if(which==='balanceovertime')fillBalanceOverTimeDrill();
  else fillMoodGroupedDrill(win);
}

// Shared event-row renderer for Phase 6.3 drills. Pulls from collection by
// release_id, falls back to a "Record no longer in collection" row if missing.
function _drillPlayRow(ev){
  const rec=collection.find(r=>r.releaseId===ev.release_id);
  const art=proxyArt(artCache[ev.release_id]);
  const when=new Date(ev.played_at);
  const dateStr=when.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const timeStr=when.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  if(!rec){
    return `<div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);color:var(--muted);font-size:12px">
      <div style="flex:1">Record no longer in collection</div>
      <div style="font-size:11px;flex-shrink:0">${dateStr} · ${timeStr}</div>
    </div>`;
  }
  return `<div class="stat-record-item" data-id="${ev.release_id}" style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)">
    <div style="width:44px;height:44px;flex-shrink:0;background:var(--surface2);border-radius:4px;overflow:hidden">${art?`<img src="${art}" style="width:100%;height:100%;object-fit:cover" alt="">`:''}</div>
    <div style="flex:1;min-width:0">
      <div style="font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${rec.title||''}</div>
      <div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${rec.artist||''}</div>
    </div>
    <div style="font-size:11px;color:var(--muted);flex-shrink:0;text-align:right">
      <div>${dateStr}</div>
      <div style="opacity:.7">${timeStr}</div>
    </div>
  </div>`;
}

// Drill for Tile 6 — list of plays grouped by day of week, most-active day
// first. Backfill events and null-mood plays excluded (mirrors tile filter).
function fillDayOfWeekDrill(){
  const events=(_mpData.recentForStreak||[]).filter(ev=>moodActiveArray(ev).length>0);
  if(!events.length){
    $('drillContent').innerHTML='<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">No plays to chart yet.</div>';
    return;
  }
  const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const byDay=Array.from({length:7},()=>[]);
  events.forEach(ev=>{byDay[new Date(ev.played_at).getDay()].push(ev);});
  const ordered=byDay.map((plays,i)=>({day:i,name:dayNames[i],plays})).filter(g=>g.plays.length>0).sort((a,b)=>b.plays.length-a.plays.length);
  let out='';
  ordered.forEach(g=>{
    out+=`<div style="margin-top:18px"><div style="font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:8px">${g.name} · ${g.plays.length} ${g.plays.length===1?'play':'plays'}</div>`;
    out+=g.plays.map(_drillPlayRow).join('');
    out+='</div>';
  });
  $('drillContent').innerHTML=out;
  wireDrillTaps([]);
}

// Drill for Tile 7 — list of plays grouped by 4-hour bucket, busiest first.
function fillTimeOfDayDrill(){
  const events=(_mpData.recentForStreak||[]).filter(ev=>moodActiveArray(ev).length>0);
  if(!events.length){
    $('drillContent').innerHTML='<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">No plays to chart yet.</div>';
    return;
  }
  const buckets=[
    {label:'Late night (12a–4a)',s:0,e:3,plays:[]},
    {label:'Early morning (4a–8a)',s:4,e:7,plays:[]},
    {label:'Morning (8a–12p)',s:8,e:11,plays:[]},
    {label:'Afternoon (12p–4p)',s:12,e:15,plays:[]},
    {label:'Late afternoon (4p–8p)',s:16,e:19,plays:[]},
    {label:'Evening (8p–12a)',s:20,e:23,plays:[]},
  ];
  events.forEach(ev=>{
    const h=new Date(ev.played_at).getHours();
    const b=buckets.find(x=>h>=x.s&&h<=x.e);
    if(b)b.plays.push(ev);
  });
  const ordered=buckets.filter(b=>b.plays.length>0).sort((a,b)=>b.plays.length-a.plays.length);
  let out='';
  ordered.forEach(g=>{
    out+=`<div style="margin-top:18px"><div style="font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:8px">${g.label} · ${g.plays.length} ${g.plays.length===1?'play':'plays'}</div>`;
    out+=g.plays.map(_drillPlayRow).join('');
    out+='</div>';
  });
  $('drillContent').innerHTML=out;
  wireDrillTaps([]);
}

// Drill for Tile 8 — multi-line chart at top regardless of data size per PRD
// §9.5 "drill-down with full multi-line chart regardless of data size", then
// list of plays grouped by week (most-recent first).
function fillBalanceOverTimeDrill(){
  const events=(_mpData.recentForStreak||[]).filter(ev=>moodActiveArray(ev).length>0);
  if(!events.length){
    $('drillContent').innerHTML='<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">No plays to chart yet.</div>';
    return;
  }
  const weeks=buildBalanceOverTimeData(events);
  let out='';
  if(weeks.length>=2){
    const usedSlugs=MOODS.map(m=>m.id).filter(slug=>weeks.some(w=>(w.byMood[slug]||0)>0));
    const svg=buildMultiLineSvg(weeks,usedSlugs,{width:340,height:140});
    const legend=usedSlugs.map(slug=>{
      const m=MOODS.find(x=>x.id===slug)||{color:'#71717a',label:slug};
      return `<span class="leg"><span class="swatch" style="background:${m.color}"></span>${m.label}</span>`;
    }).join('');
    out+=`<div class="mp-chart-wrap" style="margin:18px 0 6px">${svg}</div><div class="mp-chart-legend" style="margin-bottom:8px">${legend}</div>`;
  }
  // Group plays by week, most-recent first
  const grouped={};
  events.forEach(ev=>{
    const d=new Date(ev.played_at);
    const sunday=new Date(d);sunday.setHours(0,0,0,0);sunday.setDate(sunday.getDate()-sunday.getDay());
    const key=sunday.toISOString().slice(0,10);
    (grouped[key]||(grouped[key]=[])).push(ev);
  });
  const orderedKeys=Object.keys(grouped).sort((a,b)=>b.localeCompare(a));
  orderedKeys.forEach(key=>{
    const d=new Date(key+'T00:00:00');
    const label='Week of '+d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    const plays=grouped[key];
    out+=`<div style="margin-top:18px"><div style="font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:8px">${label} · ${plays.length} ${plays.length===1?'play':'plays'}</div>`;

// Synchronous drill for Forgotten Mood — list of lifetime-never-played records
// tagged with the given mood, sorted by dateAdded desc (newest first per PRD
// §9.5 — "sorted by date added"). Backfill not relevant (this is collection
// state, not event scan).
function fillForgottenDrill(slug){
  const m=MOODS.find(x=>x.id===slug)||{color:'#71717a',label:slug||'Mood'};
  const records=collection.filter(r=>{
    const tagged=(moodCache[r.releaseId]||[]).indexOf(slug)!==-1;
    const neverPlayed=!(playCounts[r.releaseId]>0);
    return tagged&&neverPlayed;
  }).sort((a,b)=>(b.dateAdded||'').localeCompare(a.dateAdded||''));
  let out=`<div style="font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:${m.color};margin:18px 0 8px">${m.label} · ${records.length} unplayed</div>`;
  if(!records.length){
    out+=`<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">All ${m.label.toLowerCase()} records have been played at least once.</div>`;
  }else{
    out+=records.map(r=>{
      const art=proxyArt(artCache[r.releaseId]);
      const added=r.dateAdded?new Date(r.dateAdded).toLocaleDateString(undefined,{month:'short',year:'numeric'}):'';
      return `<div class="stat-record-item" data-id="${r.releaseId}" style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="width:44px;height:44px;flex-shrink:0;background:var(--surface2);border-radius:4px;overflow:hidden">${art?`<img src="${art}" style="width:100%;height:100%;object-fit:cover" alt="">`:''}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.title||''}</div>
          <div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.artist||''}</div>
        </div>
        <div style="font-size:11px;color:var(--muted);flex-shrink:0">${added}</div>
      </div>`;
    }).join('');
  }
  $('drillContent').innerHTML=out;
  wireDrillTaps([]);
}

// Synchronous drill for Streaks — the streak's plays as list rows. Recomputes
// the streak from current _mpData.recentForStreak so it stays consistent with
// the tile. Most-recent first.
function fillStreakDrill(slug,kind){
  const s=computeStreak();
  const m=MOODS.find(x=>x.id===slug)||{color:'#71717a',label:slug||'Mood'};

  if(!plays.length){

          <div style="font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${rec.title||''}</div>
          <div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${rec.artist||''}</div>

// Drill for Mood Mix + Cycle Mood Balance — plays in the window grouped by
// mood (multi-mood plays appear under each). Owner app fetches this async;
// the share page already holds every event, so it renders synchronously.
function fillMoodGroupedDrill(win){
  let cutoff=null;
  if(win==='cycle'&&cycleStartedAt)cutoff=new Date(cycleStartedAt).getTime();
  else if(win==='30d')cutoff=Date.now()-30*24*60*60*1000;
  const grouped={};
  playEvents.forEach(ev=>{
    const moods=moodActiveArray(ev);
    if(!moods.length)return;
    if(cutoff&&new Date(ev.played_at).getTime()<cutoff)return;
    moods.forEach(slug=>{(grouped[slug]||(grouped[slug]=[])).push(ev);});
  });
  const slugsByCount=Object.entries(grouped).sort((a,b)=>b[1].length-a[1].length).map(([s])=>s);
  let out='';
  slugsByCount.forEach(slug=>{
    const m=MOODS.find(x=>x.id===slug)||{color:'#71717a',label:slug};
    out+=`<div style="margin-top:18px"><div style="font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:${m.color};margin-bottom:8px">${m.label} · ${grouped[slug].length}</div>`;
    out+=grouped[slug].map(_drillPlayRow).join('');
    out+='</div>';
  });
  if(!out)out='<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">No plays in this window yet.</div>';
  $('drillContent').innerHTML=out;
  wireDrillTaps();
}

// ---- Recently Spun (read-only port of /vinyl Listening Timeline §9.7) ----
// All events are already loaded (share page reads the full history once), so
// no pagination — filter + bucket client-side.
let _recentMoodFilter='all',_recentEarlierCollapsed=true;

function formatPlayedAt(iso){
  const d=new Date(iso);
  const diff=Date.now()-d.getTime();
  const mins=Math.floor(diff/60000);
  if(mins<1)return 'Just now';
  if(mins<60)return mins+'m ago';
  const hrs=Math.floor(mins/60);
  if(hrs<24)return hrs+'h ago';
  const days=Math.floor(hrs/24);
  if(days<7)return d.toLocaleDateString(undefined,{weekday:'short'})+' '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

// Today = calendar today; then last 7 days, last 30 days, earlier.
function recentBucketFor(playedAt){
  const ms=Date.now()-new Date(playedAt).getTime();
  const DAY=86400000;
  const d=new Date(playedAt);const now=new Date();
  if(d.toDateString()===now.toDateString())return 'today';
  if(ms<7*DAY)return 'week';
  if(ms<30*DAY)return 'month';
  return 'earlier';
}

const RECENT_BUCKET_LABELS={today:'Today',week:'This week',month:'This month',earlier:'Earlier'};

function openRecent(){
  switchView('recent');
  if(_recentMoodFilter!=='all'&&!MOODS.find(m=>m.id===_recentMoodFilter))_recentMoodFilter='all';

function paintRecentMoodFilterBtn(){

  const mood=MOODS.find(m=>m.id===_recentMoodFilter);
  btn.textContent=mood?'Mood: '+mood.label:'Mood: All';

  btn.style.color=mood?'#fff':'';
}

$('recentMoodFilterBtn').onclick=()=>{
  const opts=['all',...MOODS.map(m=>m.id)];

function renderRecentList(){
  const list=$('recentList'),empty=$('recentEmpty'),count=$('recentCount');
  if(!playEvents.length){
    list.innerHTML='';empty.style.display='block';count.textContent='';
    return;
  }
  empty.style.display='none';
  const rows=playEvents.filter(ev=>_recentMoodFilter==='all'||moodActiveArray(ev).includes(_recentMoodFilter));
  if(!rows.length){
    list.innerHTML='<div style="padding:24px 8px;color:var(--muted);font-size:13px;text-align:center">No plays match this mood yet.</div>';
    count.textContent='0 of '+playEvents.length;
    return;
  }
  count.textContent=_recentMoodFilter==='all'
    ?rows.length+' play'+(rows.length===1?'':'s')
    :rows.length+' of '+playEvents.length;
  const buckets={today:[],week:[],month:[],earlier:[]};
  rows.forEach(ev=>buckets[recentBucketFor(ev.played_at)].push(ev));
  const renderRow=ev=>{
    const rec=collection.find(r=>r.releaseId===ev.release_id);
    const art=rec?proxyArt(artCache[rec.releaseId]||rec.coverImage):'';
    const moods=moodActiveArray(ev).map(slug=>MOODS.find(x=>x.id===slug)).filter(Boolean);
    const moodHtml=moods.length?'<div class="recent-mood-pills">'+moods.map(m=>'<span class="recent-mood-pill" style="background:'+m.color+'">'+m.label+'</span>').join('')+'</div>':'';
    return '<div class="recent-row" data-release-id="'+ev.release_id+'">'+
      '<div class="recent-art">'+(art?'<img src="'+art+'" alt="" loading="lazy">':'')+'</div>'+
      '<div class="recent-info">'+
        '<div class="recent-title">'+(rec?rec.title:'Record no longer in collection')+'</div>'+
        '<div class="recent-artist">'+(rec?rec.artist:'')+'</div>'+
      '</div>'+
      '<div class="recent-meta">'+moodHtml+'<div class="recent-when">'+formatPlayedAt(ev.played_at)+'</div></div>'+
    '</div>';
  };
  const parts=[];
  ['today','week','month','earlier'].forEach(key=>{
    const b=buckets[key];
    if(!b.length)return;
    const collapsible=key==='earlier';
    const collapsed=collapsible&&_recentEarlierCollapsed;
    parts.push('<div class="recent-bucket-header'+(collapsible?' collapsible':'')+(collapsed?' collapsed':'')+'">'+(collapsible?'<span class="recent-bucket-caret">▼</span>':'')+RECENT_BUCKET_LABELS[key]+' <span style="opacity:.6;font-weight:400">· '+b.length+'</span></div>');
    if(!collapsed)parts.push(b.map(renderRow).join(''));
  });
  list.innerHTML=parts.join('');
  list.querySelectorAll('.recent-row').forEach(row=>{
    row.onclick=()=>{
      const rec=collection.find(r=>r.releaseId===row.dataset.releaseId);
      if(rec)openSheet(rec);
    };
  });
  list.querySelectorAll('.recent-bucket-header.collapsible').forEach(h=>{
    h.onclick=()=>{_recentEarlierCollapsed=!_recentEarlierCollapsed;renderRecentList();};
  });
}

async function loadArtistBio(artistId,artistName,wikiUrl){
  const bioEl=$('artistBioText');
  if(!bioEl)return;
  const artist=artistsDB[artistId];
  if(artist&&artist.bio_text&&artist.bio_text.length>50){
    const paras=artist.bio_text.split('\n').filter(p=>p.trim().length>30).slice(0,4);
    bioEl.innerHTML=paras.map(p=>'<p>'+p+'</p>').join('');
    return;
  }
  const url=wikiUrl&&wikiUrl!=='__none__'?wikiUrl:'';
  let bio=null;
  if(url){
    try{
      const wikiTitle=decodeURIComponent(url.split('/wiki/').pop());
      const res=await fetch('https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=true&explaintext=true&titles='+encodeURIComponent(wikiTitle)+'&format=json&origin=*');
      const data=await res.json();
      const page=Object.values(data.query.pages)[0];
      if(page&&page.extract&&page.extract.length>100)bio=page.extract;
    }catch{}
  }
  if(!bio&&artistName){
    try{
      const res=await fetch('https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=true&explaintext=true&titles='+encodeURIComponent(artistName)+'&format=json&origin=*');
      const data=await res.json();
      const page=Object.values(data.query.pages)[0];
      if(page&&page.extract&&page.extract.length>100)bio=page.extract;
    }catch{}
  }
  if(bio){
    const paras=bio.split('\n').filter(p=>p.trim().length>30).slice(0,4);
    bioEl.innerHTML=paras.map(p=>'<p>'+p+'</p>').join('');
  }else{
    bioEl.innerHTML='<p style="color:var(--muted)">No biography found.</p>';
  }
}

async function loadWantlist(){
  if(wantlistLoaded){applyWantlistFilters();return;}
  $('wantlistGrid').innerHTML='';$('wantlistEmpty').style.display='none';
  const res=await crate.loadWantlist({userId:ownerUserId});
  if(res.success&&res.data&&res.data.length){

    wantlistLoaded=true;
    applyWantlistFilters();
  }else{
    $('wantlistEmpty').style.display='block';
    $('wantlistCount').textContent='';

function applyWantlistFilters(){
  const q=($('searchBarTop')||{value:''}).value.toLowerCase();
  wantFiltered=wantlist.filter(r=>{
    if(!q)return true;
    return r.artist.toLowerCase().includes(q)||r.title.toLowerCase().includes(q)||(r.label||'').toLowerCase().includes(q)||(r.year&&String(r.year).includes(q));
  });
  // Sort
  const mode=wantSortModes[wantSortIdx];
  if(mode==='alpha')wantFiltered.sort((a,b)=>(a.artist||'').localeCompare(b.artist||''));
  else if(mode==='date_desc')wantFiltered.sort((a,b)=>new Date(b.dateAdded||0)-new Date(a.dateAdded||0));
  else if(mode==='date_asc')wantFiltered.sort((a,b)=>new Date(a.dateAdded||0)-new Date(b.dateAdded||0));
  else if(mode==='year')wantFiltered.sort((a,b)=>(parseInt(b.year)||0)-(parseInt(a.year)||0));
  $('wantlistCount').textContent=q?wantFiltered.length+' of '+wantlist.length+' on the hunt':wantlist.length+' on the hunt';
  $('wantlistEmpty').style.display=wantFiltered.length?'none':'block';
  renderWantlistGrid();
  if(activeView==='want')updateScrubber();
}

  grid.innerHTML=wantFiltered.map(r=>{
    const art=proxyArt(r.coverImage||(r.thumb&&!r.thumb.includes('spacer')?r.thumb:''));

      '<div class="art-wrap">'+(art?'<img src="'+art+'" alt="" loading="lazy">':'<div class="art-placeholder">&#9825;</div>')+'</div>'+

            '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> Shop</a>'+
