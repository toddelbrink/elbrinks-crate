// ---- Helpers ----
function proxyArt(url){
  if(!url)return'';
  return crate.proxyImage(url);
}
function stars(n){return '\u2605'.repeat(Math.min(5,Math.max(0,n)));}
function shortCondition(c){
  if(!c)return'';
  const map={'Mint (M)':'M','Near Mint (NM or M-)':'NM','Very Good Plus (VG+)':'VG+','Very Good (VG)':'VG','Good Plus (G+)':'G+','Good (G)':'G','Fair (F)':'F','Poor (P)':'P'};
  return map[c]||c;
}
function formatLastPlayed(d){
  if(!d)return'';
  const dt=new Date(d);if(isNaN(dt))return'';
  const now=new Date(),diff=now-dt,days=Math.floor(diff/864e5);
  if(days===0)return'Today';if(days===1)return'Yesterday';if(days<7)return days+' days ago';
  if(days<30)return Math.floor(days/7)+' week'+(Math.floor(days/7)>1?'s':'')+' ago';
  return dt.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

async function fetchTracks(releaseId){
  try{
    const res=await fetch('https://api.discogs.com/releases/'+releaseId,{headers:{'User-Agent':'ElbrinksCrate/1.0'}});
    if(!res.ok)return[];
    const data=await res.json();
    return(data.tracklist||[]).filter(t=>t.type_==='track');
  }catch{return[];}
}

async function loadAbout(r){
  const wikiUrl=wikiCache[r.releaseId]||'';
  if(wikiUrl&&wikiUrl!=='__none__'){
    try{
      const title=decodeURIComponent(wikiUrl.split('/wiki/').pop());
      const res=await fetch('https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=true&explaintext=true&titles='+encodeURIComponent(title)+'&format=json&origin=*');
      const data=await res.json();
      const page=Object.values(data.query.pages)[0];
      if(page&&page.extract&&page.extract.length>100)return{text:page.extract,url:wikiUrl};
    }catch{}
  }
  // Fallback: search by artist name
  if(r.artist){
    try{
      const res=await fetch('https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=true&explaintext=true&titles='+encodeURIComponent(r.artist)+'&format=json&origin=*');
      const data=await res.json();
      const page=Object.values(data.query.pages)[0];
      if(page&&page.extract&&page.extract.length>100)return{text:page.extract,url:'https://en.wikipedia.org/wiki/'+encodeURIComponent(r.artist)};
    }catch{}
  }
  return null;
}

// ---- Index Scrubber (alpha + decade) ----
// Port of /vinyl updateAlphaScrubber: letters under Artist A-Z, decades under
// Year, on both Crate and Want. Fades back while idle; tap or slide to jump.
let scrubberEnabled=false,scrubberFadeTimer=null;

function updateScrubber(){
  const scrubber=$('alphaScrubber');
  const isCrate=activeView==='crate';
  const isWant=activeView==='want';
  const sortMode=sortModes[sortIdx],wantSortMode=wantSortModes[wantSortIdx];
  const showAlpha=(isCrate&&sortMode==='alpha')||(isWant&&wantSortMode==='alpha');
  const showYear=(isCrate&&sortMode==='year')||(isWant&&wantSortMode==='year');
  if(!showAlpha&&!showYear){scrubber.classList.remove('visible');scrubberEnabled=false;return;}
  const items=isCrate?filtered:wantFiltered;
  const gridId=isCrate?'grid':'wantlistGrid';
  if(items.length<10){scrubber.classList.remove('visible');scrubberEnabled=false;return;}

  const letterOf=r=>{const ch=(r.artist||'').charAt(0).toUpperCase();return /[A-Z]/.test(ch)?ch:'#';};
  let markers=[];
  if(showAlpha){
    markers=[...new Set(items.map(letterOf))].sort((a,b)=>a==='#'?1:b==='#'?-1:a.localeCompare(b)).map(m=>({val:m,label:m}));
  }else{
    const decades=[...new Set(items.map(r=>{
      const y=parseInt(r.year)||0;
      return y<1950?0:Math.floor(y/10)*10;
    }).filter(d=>d>0))].sort((a,b)=>b-a);
    markers=decades.map(d=>({val:String(d),label:d+'s'}));
  }
  if(markers.length<3){scrubber.classList.remove('visible');scrubberEnabled=false;return;}
  const maxMarkers=14;
  if(markers.length>maxMarkers){
    const step=Math.ceil(markers.length/maxMarkers);
    markers=markers.filter((_,i)=>i%step===0||i===markers.length-1);
  }
  scrubber.innerHTML=markers.map(m=>'<span data-marker="'+m.val+'">'+m.label+'</span>').join('');
  scrubberEnabled=true;
  scrubber.classList.add('visible');
  scrubber.classList.add('scroll-fade');

  let lastJump='';
  function jumpTo(marker){
    if(marker===lastJump)return;lastJump=marker;
    let idx=-1;
    if(showAlpha){
      idx=items.findIndex(r=>letterOf(r)===marker);
    }else{
      const decade=parseInt(marker);
      idx=items.findIndex(r=>{const y=parseInt(r.year)||0;return y>=decade&&y<decade+10;});
    }
    if(idx<0)return;
    const cards=$(gridId).querySelectorAll('.record-card');
    if(cards[idx]){
      const headerH=document.querySelector('header').offsetHeight||56;
      const rect=cards[idx].getBoundingClientRect();
      window.scrollTo({top:Math.max(0,window.scrollY+rect.top-headerH-12),behavior:'instant'});
    }
    const toast=$('alphaJumpToast');
    toast.textContent=showYear?parseInt(marker)+'s':marker;toast.classList.add('show');
    clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),800);
    scrubber.classList.remove('scroll-fade');
    clearTimeout(scrubberFadeTimer);
    scrubberFadeTimer=setTimeout(()=>{scrubber.classList.add('scroll-fade');},2000);
  }

  // Touch: tap + slide (no onclick — 300ms delay on mobile Safari). Mouse
  // clicks still work on desktop via onclick.
  let touching=false,moved=false,tapTarget=null;
  scrubber.ontouchstart=e=>{
    touching=true;moved=false;lastJump='';e.preventDefault();
    scrubber.classList.remove('scroll-fade');
    const t=e.touches[0];const el=document.elementFromPoint(t.clientX,t.clientY);
    tapTarget=(el&&el.dataset&&el.dataset.marker)?el.dataset.marker:null;
  };
  scrubber.ontouchmove=e=>{
    if(!touching)return;moved=true;e.preventDefault();
    const t=e.touches[0];const el=document.elementFromPoint(t.clientX,t.clientY);
    if(el&&el.dataset&&el.dataset.marker)jumpTo(el.dataset.marker);
  };
  scrubber.ontouchend=()=>{
    if(!moved&&tapTarget){lastJump='';jumpTo(tapTarget);}
    touching=false;tapTarget=null;lastJump='';
    clearTimeout(scrubberFadeTimer);
    scrubberFadeTimer=setTimeout(()=>{scrubber.classList.add('scroll-fade');},2000);
  };
  scrubber.onclick=e=>{
    const m=e.target.dataset&&e.target.dataset.marker;
    if(m){lastJump='';jumpTo(m);}
  };
}

window.addEventListener('scroll',()=>{
  if(!scrubberEnabled)return;
  const scrubber=$('alphaScrubber');
  scrubber.classList.remove('scroll-fade');
  clearTimeout(scrubberFadeTimer);
  scrubberFadeTimer=setTimeout(()=>{scrubber.classList.add('scroll-fade');},1500);
},{passive:true});

crateReady.then(loadAllData);
